# Automation Rules for BMS Engine

rules:
  - alias: "bat den khi toi va co nguoi"
    enabled: false
    triggers:
      - type: mqtt
        topic: "zigbee/motion/state"
      - type: mqtt
        topic: "zigbee/light_sensor/lux"
    conditions:
      - type: numeric_state
        topic: "zigbee/light_sensor/lux"
        below: 50
      - type: state
        topic: "zigbee/motion/state"
        equals: "on"
      - type: time
        after: "18:00:00"
        before: "23:00:00"
    actions:
      - type: mqtt_publish
        topic: "zigbee/switch/cmd"
        payload: "ON"
        qos: 1

  - alias: "tat AC khi nhiet do thap"
    enabled: false
    triggers:
      - type: mqtt
        topic: "tele/tasmota_6DCAA8/SENSOR"
    conditions:
      - type: numeric_state
        topic: "zigbee/ac/room_temp"
        below: 20
    actions:
      - type: mqtt_publish
        topic: "cmnd/tasmota_6DCAA8/ZbSend"
        payload: '{"Device":"0xC5A9","Write":{"EF00/0101":0}}'
        qos: 1

  - alias: "bat AC truoc gio lam viec"
    enabled: false
    triggers:
      - type: time
        at: "07:30:00"
    conditions:
      - type: time
        after: "07:00:00"
        before: "08:00:00"
    actions:
      - type: mqtt_publish
        topic: "cmnd/tasmota_6DCAA8/ZbSend"
        payload: '{"Device":"0xC5A9","Write":{"EF00/0101":1,"EF00/0202":24}}'
        qos: 1
