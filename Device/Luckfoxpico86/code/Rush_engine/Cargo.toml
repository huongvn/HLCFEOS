[package]
name = "bms-engine"
version = "1.0.0"
edition = "2021"
description = "BMS Engine - Rust Building Management System for Smart Cafe"
license = "MIT"

[dependencies]
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
glob = "0.3"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

[profile.release]
lto = true
opt-level = "z"
strip = true
codegen-units = 1
