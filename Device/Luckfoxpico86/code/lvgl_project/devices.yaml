    zigbee_addr: "0x2F11"
    nr_type: switch
    name: "Switch Office"
    group: "Office"
    gateway: "tasmota_6DD514"
    sign_index: 1
    enabled: true
    attributes:
      - id: "0000"
        label: "Power"
        type: bool
        display: true
        control: true
        xsolar: true
        xsolar_key: "power"
