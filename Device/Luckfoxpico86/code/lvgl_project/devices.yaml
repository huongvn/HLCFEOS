      - id: "PowerFactorPhC"
        label: "PF C"
        type: number
        scale: 0.01
        display: true
        overview: false
        xsolar: false
      # 3-Phase Totals
      - id: "TotalActivePower"
        label: "Total Power"
        type: number
        unit: "W"
        display: true
        xsolar: true
        xsolar_key: "total_active_power"
      - id: "TotalReactivePower"
