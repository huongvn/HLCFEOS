  # ═══════════════════════════════════════════════
  # Light Sensor (ZCL 0x0400)
  # ═══════════════════════════════════════════════
  - device_id: 6
    zigbee_addr: "0x8BA4"
    nr_type: light_sensor
    name: "Light Sensor"
    group: "Outdoor"
    gateway: "tasmota_6DD514"
    light_sensor_index: 0
    enabled: true
    attributes:
      - id: "Illuminance"
        label: "Illuminance"
        type: number
        formula: "zcl_illuminance"
        unit: "lux"
        display: true
        overview: true
        xsolar: true
        xsolar_key: "illuminance"

  # ═══════════════════════════════════════════════
  # Switch (Zigbee switch for on/off test)
  # ═══════════════════════════════════════════════
