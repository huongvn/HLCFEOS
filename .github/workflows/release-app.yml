name: Build & Release LVGL App
on:
  push:
    tags: ['app-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            RAW="${{ github.ref_name }}"
          else
            RAW="app-v${{ github.event.inputs.version }}"
          fi
          VER="${RAW#app-v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"
      - name: Install cross-toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf make file
      - name: Build
        run: |
          cd Device/Luckfoxpico86/code/lvgl_project
          make APP_VERSION=${{ steps.ver.outputs.version }}
          file ota/app_v${{ steps.ver.outputs.version }}
      - name: Verify static ARM binary
        run: |
          cd Device/Luckfoxpico86/code/lvgl_project
          file ota/app_v${{ steps.ver.outputs.version }} | grep -E "ARM|EABI|static" \
            && grep -q "statically linked" <(file ota/app_v${{ steps.ver.outputs.version }})
      - name: Upload app assets to engine release (bms-v*)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          cd Device/Luckfoxpico86/code/lvgl_project
          echo "Waiting for bms-v${VER} release..."
          for i in $(seq 1 30); do
            if gh release view "bms-v${VER}" >/dev/null 2>&1; then break; fi
            echo "release bms-v${VER} chưa có, retry $i/30..."
            sleep 10
          done
          gh release view "bms-v${VER}" >/dev/null 2>&1 || { echo "::error::release bms-v${VER} không tồn tại"; exit 1; }
          gh release upload "bms-v${VER}" \
            ota/app_v${VER} ota/app_v${VER}.sha256 --clobber
          gh release view "bms-v${VER}" --json tag_name,assets --jq '.tag_name, .assets[].name'